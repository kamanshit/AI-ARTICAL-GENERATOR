{% extends "articles/base.html" %}

{% block title %}
Articles
{% endblock %}

{% block content %}

<h1>Articles</h1>

{% for article in articles %}

    <h2>
        <a href="{% url 'article_detail' article.id %}">
            {{ article.topic }}
        </a>
    </h2>

    <small>
        Created: {{ article.created_at }}
    </small>

    <hr>

{% empty %}

    <p>No articles have been generated yet.</p>

{% endfor %}

{% endblock %}
