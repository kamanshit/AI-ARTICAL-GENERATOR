{% extends "articles/base.html" %}

{% block title %}

{% block content %}

<h1>Edit Article</h1>

    {% csrf_token %}

    {{ form.as_p }}

</form>

<br>

<a href="{% url 'article_detail' article.id %}">
    ← Cancel
</a>

{% endblock %}
