{% extends "articles/base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Welcome Back</h1>

            <p>
                Login to continue to AI Article Generator.
            </p>

        </div>


        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">
            Don't have an account?
            <a href="{% url 'register' %}">
                Create one
            </a>
        </p>

    </div>

</div>

{% endblock %}
